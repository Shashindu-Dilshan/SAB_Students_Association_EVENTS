<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set your password | SABSA E-Ticket System</title>
  <link rel="stylesheet" href="assets/css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/staff-access.js"></script>
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .password-card { width: min(100%, 440px); padding: 28px; background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; box-shadow: 0 12px 36px #11182712; }
    .password-card h1 { margin: 0 0 8px; font-size: 23px; }
    .password-card p { color: #6b7280; line-height: 1.55; }
    .password-card label { display: grid; gap: 7px; margin-top: 17px; font-size: 13px; font-weight: 600; }
    .password-card input { padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 8px; }
    .password-card button { width: 100%; margin-top: 20px; }
    #passwordMessage { min-height: 20px; margin-top: 13px; font-size: 13px; }
    #passwordMessage.error { color: #b91c1c; }
    #passwordMessage.success { color: #15803d; }
  </style>
</head>
<body>
  <main class="password-card">
    <h1>Set your permanent password</h1>
    <p>Your account was created with a temporary password. Choose a new password before opening the staff pages.</p>
    <form id="passwordForm">
      <label for="newPassword">New password<input id="newPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
      <label for="confirmPassword">Confirm new password<input id="confirmPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
      <button type="submit" class="primary-btn" id="savePasswordButton">Save password</button>
      <div id="passwordMessage" role="status" aria-live="polite"></div>
    </form>
  </main>
  <script>
    const SUPABASE_URL = 'https://xdaxxgsvorvfpnxteikv.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_wRysyx1ek-J7XrFOLxXfnA_Fp_0UsFO';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const message = document.getElementById('passwordMessage');

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const access = await window.requireStaffPageAccess(supabaseClient, 'change-password');
        if (access) document.querySelector('main p').textContent = `Set a permanent password for ${access.admin.email || access.user.email}.`;
      } catch (error) {
        message.textContent = error.message || 'Unable to verify your account.';
        message.className = 'error';
      }
    });

    document.getElementById('passwordForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('newPassword').value;
      const confirmation = document.getElementById('confirmPassword').value;
      const button = document.getElementById('savePasswordButton');
      message.textContent = '';
      message.className = '';
      if (password !== confirmation) {
        message.textContent = 'The passwords do not match.';
        message.className = 'error';
        return;
      }
      button.disabled = true;
      try {
        const { data, error } = await supabaseClient.functions.invoke('staff-management', {
          body: { action: 'change-password', password }
        });
        if (error || data?.error) throw new Error(data?.error || error.message);
        message.textContent = 'Password saved. Sign in again with your new password.';
        message.className = 'success';
        await supabaseClient.auth.signOut();
        window.location.replace('admin.html');
      } catch (error) {
        message.textContent = error.message || 'Unable to change the password.';
        message.className = 'error';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
